name: Daily market data

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: daily-market-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true

      - name: Prepare standalone data checkout
        env:
          MARKET_DATA_DEPLOY_KEY: ${{ secrets.MARKET_DATA_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          : "${MARKET_DATA_DEPLOY_KEY:?MARKET_DATA_DEPLOY_KEY is required}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$MARKET_DATA_DEPLOY_KEY" > "$HOME/.ssh/market-data-deploy"
          chmod 600 "$HOME/.ssh/market-data-deploy"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          git config core.sshCommand "ssh -i $HOME/.ssh/market-data-deploy -o IdentitiesOnly=yes"
          git -C data remote set-url origin git@github.com:the-jolly-green-bryant/eso-market-data.git
          git -C data fetch --depth=1 origin main
          git -C data checkout -B main origin/main

      - name: Setup project
        uses: ./.github/actions/setup-dependencies

      - name: Download ESO uploader for observation ingest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="$(gh api repos/sirinsidiator/ESOAddOnUploaderCLI/releases/latest \
            --jq '.assets[] | select(.name | endswith("-linux.tar.gz")) | .browser_download_url')"
          curl -fsSL "$url" -o "$RUNNER_TEMP/eso-uploader.tar.gz"
          tar -xzf "$RUNNER_TEMP/eso-uploader.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/ESOAddOnUploaderCli"
          echo "ESO_UPLOADER_CLI=$RUNNER_TEMP/ESOAddOnUploaderCli" >> "$GITHUB_ENV"

      - name: Inject release version
        run: pnpm inject-version

      - name: Run ordered incremental update
        id: update
        run: pnpm --filter @eso-market-tracker/master-update daily
        env:
          BNET_USERNAME: ${{ secrets.BNET_USERNAME }}
          BNET_PASSWORD: ${{ secrets.BNET_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UESP_COOKIE: ${{ secrets.UESP_COOKIE }}
          ESO_UPDATE_STATS_PATH: ${{ runner.temp }}/update-stats.json

      - name: Detect generated changes
        id: changes
        run: |
          rsync -a \
            --include='data.*.lua' \
            --exclude='*' \
            apps/deployments/eso-addon/src/MarketTracker/ \
            data/addon/MarketTracker/
          changed_pages="$(find apps/deployments/website/dist/item \
            -type f -name index.html 2>/dev/null | wc -l | tr -d ' ')"
          changed_data_files="$(git -C data status --porcelain | wc -l | tr -d ' ')"
          echo "page_count=$changed_pages" >> "$GITHUB_OUTPUT"
          echo "data_file_count=$changed_data_files" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.update.outputs.changed_item_count }}" != "0" ] &&
             [ -n "$(git -C data status --porcelain)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.changes.outputs.found == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload changed static item pages
        if: steps.changes.outputs.found == 'true'
        working-directory: apps/deployments/website
        run: |
          set -euo pipefail
          find dist/item -type f -name index.html -print0 |
            while IFS= read -r -d '' file; do
              aws s3 cp "$file" "s3://esomarkettracker.com/${file#dist/}" \
                --acl public-read
            done

      - name: Notify search engines about changed items
        if: steps.changes.outputs.found == 'true'
        continue-on-error: true
        run: |
          pnpm tsx scripts/submit-indexnow.ts \
            --pages apps/deployments/website/dist/item

      # Add-on publishing is paused until an approved publisher is available.

      - name: Commit generated data
        id: commit
        if: steps.changes.outputs.found == 'true'
        run: |
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C data add -A
          git -C data commit -m "Daily market data update $(date -u +%F)"
          git -C data push origin HEAD:main
          echo "published_sha=$(git -C data rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Announce successful launch to Discord admin
        if: steps.changes.outputs.found == 'true'
        env:
          DISCORD_ADMIN_WEBHOOK_URL: ${{ secrets.DISCORD_ADMIN_WEBHOOK_URL }}
          CHANGED_ITEM_COUNT: ${{ steps.update.outputs.changed_item_count }}
          CHANGED_PAGE_COUNT: ${{ steps.changes.outputs.page_count }}
          CHANGED_DATA_FILE_COUNT: ${{ steps.changes.outputs.data_file_count }}
          UPDATE_TOTAL_SECONDS: ${{ steps.update.outputs.total_seconds }}
          PUBLISHED_SHA: ${{ steps.commit.outputs.published_sha }}
        run: pnpm tsx scripts/discord-update-summary.ts
