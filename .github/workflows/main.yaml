name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-dependencies

      - name: Lint and type-check
        run: pnpm check

      - name: Build database
        uses: ./.github/actions/build-sqlite

      - name: Run coverage
        uses: ./.github/actions/run-coverage
        with:
          UESP_COOKIE: ${{ secrets.UESP_COOKIE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build website artifact
        run: |
          pnpm inject-version
          pnpm --filter eso_market_tracker_app build
          tar -czf "$RUNNER_TEMP/website-dist.tar.gz" \
            -C apps/deployments/website dist

      - name: Upload website artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: ${{ runner.temp }}/website-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-dependencies

      - name: Inject release version
        run: pnpm inject-version

      - name: Download SQLite artifact
        uses: actions/download-artifact@v8
        with:
          name: sqlite-database
          path: data/artifacts

      - name: Download website artifact
        uses: actions/download-artifact@v8
        with:
          name: website-dist
          path: ${{ runner.temp }}/website-dist

      - name: Extract website artifact
        run: |
          rm -rf apps/deployments/website/dist
          tar -xzf "$RUNNER_TEMP/website-dist/website-dist.tar.gz" \
            -C apps/deployments/website

      - name: Download coverage badge
        uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: coverage-badge

      - name: Publish coverage badge
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: coverage-badge
          publish_branch: coverage-badge
          force_orphan: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload to S3
        working-directory: apps/deployments/website
        run: |
          aws s3 sync ./dist/ s3://esomarkettracker.com/ \
            --delete \
            --acl public-read

      - name: Notify search engines with IndexNow
        continue-on-error: true
        run: |
          pnpm tsx scripts/submit-indexnow.ts \
            --sitemap apps/deployments/website/dist/sitemap.xml

      - name: Deploy API
        run: cd apps/deployments/api/src/market-tracker-api && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure Discord bot
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "DISCORD_BOT_TOKEN is not configured; skipping Discord setup."
            exit 0
          fi
          pnpm discord:configure
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: "1121195192066781305"
          DISCORD_INTERACTIONS_ENDPOINT: "https://data.esomarkettracker.com/discord/interactions"

      # Add-on publishing is paused until an approved publisher is available.

      - name: Create or update rolling release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="Latest"
          FILE="data/artifacts/data.sqlite"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "The latest pricing information in SQLite format."

          gh release upload "$TAG" "$FILE" --clobber
