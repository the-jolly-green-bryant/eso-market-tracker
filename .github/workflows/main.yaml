name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-dependencies

      - name: Lint and type-check
        run: pnpm check

      - name: Build database
        uses: ./.github/actions/build-sqlite

      - name: Run coverage
        uses: ./.github/actions/run-coverage
        with:
          UESP_COOKIE: ${{ secrets.UESP_COOKIE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-dependencies

      - name: Download SQLite artifact
        uses: actions/download-artifact@v5
        with:
          name: sqlite-database
          path: data/artifacts

      - name: Download coverage badge
        uses: actions/download-artifact@v5
        with:
          name: coverage-badge
          path: coverage-badge

      - name: Publish coverage badge
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: coverage-badge
          publish_branch: coverage-badge
          force_orphan: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # This will be built and committed to repo, don't rebuild.
      - name: Upload to S3
        working-directory: apps/deployments/website
        run: |
          aws s3 sync ./dist/ s3://esomarkettracker.com/ \
            --delete \
            --acl public-read

      - name: Deploy API
        run: cd apps/deployments/api/src/market-tracker-api && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Addon
        uses: ./.github/actions/upload-eso-addon
        with:
          bnet_username: ${{ secrets.BNET_USERNAME }}
          bnet_password: ${{ secrets.BNET_PASSWORD }}
          addon_id: ${{ secrets.BNET_ADDON_ID }}
          release_note: "Automated upload from ${{github.sha}}"
          publish: "true"
          concurrency: "1"
          cli_uploader_version: "latest"

      - name: Create or update rolling release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="Latest"
          FILE="data/artifacts/data.sqlite"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "The latest pricing information in SQLite format."

          gh release upload "$TAG" "$FILE" --clobber
