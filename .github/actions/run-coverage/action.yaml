name: Run Coverage
description: Runs tests and calculates test coverage.

inputs:
  UESP_COOKIE:
    required: false
    description: The cookie needed for accessing UESP
    default: ""
  GITHUB_TOKEN:
    required: false
    description: The token for coverage upload
    default: ""
  CLOUDFLARE_API_TOKEN:
    required: false
    description: The token for Cloudflare KV
    default: ""

runs:
  using: composite
  steps:
    - name: Run coverage
      run: pnpm run coverage
      shell: bash
      env:
        UESP_COOKIE: ${{inputs.UESP_COOKIE}}
        CLOUDFLARE_API_TOKEN: ${{inputs.CLOUDFLARE_API_TOKEN}}
        CI: 1

    - name: Extract total line coverage
      run: |
        COVERAGE=$(node -e "const fs=require('fs'); const summary=JSON.parse(fs.readFileSync('./coverage/coverage-summary.json','utf8')); console.log(summary.total.lines.pct)")
        echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
      shell: bash

    - name: Choose badge color
      run: |
        if (( $(echo "$COVERAGE >= 90" | bc -l) )); then
          COLOR="brightgreen"
        elif (( $(echo "$COVERAGE >= 80" | bc -l) )); then
          COLOR="green"
        elif (( $(echo "$COVERAGE >= 70" | bc -l) )); then
          COLOR="yellow"
        elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
          COLOR="orange"
        else
          COLOR="red"
        fi
        echo "BADGE_COLOR=$COLOR" >> $GITHUB_ENV
      shell: bash

    - name: Generate badge JSON
      run: |
        mkdir -p coverage-badge
        printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$COVERAGE" "$BADGE_COLOR" > coverage-badge/badge.json
      shell: bash

    - name: Deploy badge branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ inputs.GITHUB_TOKEN }}
        publish_dir: coverage-badge
        publish_branch: coverage-badge
        force_orphan: true