name: Download SQLite Artifact
description: Downloads the current database built by the standalone data repository.

runs:
  using: composite
  steps:
    - name: Download current sqlite database
      run: |
        mkdir -p data/artifacts
        curl --fail --location --retry 3 \
          https://github.com/the-jolly-green-bryant/eso-market-data/releases/download/latest/data.sqlite \
          --output data/artifacts/data.sqlite
      shell: bash

    - name: Upload sqlite artifact
      uses: actions/upload-artifact@v7
      with:
        name: sqlite-database
        path: data/artifacts/data.sqlite
        if-no-files-found: error
        retention-days: 7
